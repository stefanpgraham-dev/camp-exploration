name: Publish Foundry release
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        run: node tests/smoke.mjs
      - name: Build ZIP and manifest
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("module.json"))["version"])')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 tools/package.py --repo "$GITHUB_REPOSITORY" --version "$VERSION"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Camp & Exploration v${{ env.VERSION }}
          files: |
            dist/module.json
            dist/camp-exploration.zip
          generate_release_notes: true
